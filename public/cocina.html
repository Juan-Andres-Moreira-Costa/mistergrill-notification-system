<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="refresh" content="30"> <!-- Auto-refresh cada 30s -->
  <title>🍳 Panel de Cocina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      padding: 1rem;
      color: #1e293b;
    }
    
    /* Header */
    .header {
      background: #0f172a;
      color: white;
      padding: 1rem 2rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.5rem; }
    .stats { display: flex; gap: 1.5rem; font-size: 0.9rem; }
    .stat { text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: bold; }
    .stat-label { font-size: 0.75rem; opacity: 0.8; }
    
    /* Filtros */
    .filtros {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filtro-btn {
      background: white;
      border: 2px solid #e2e8f0;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filtro-btn:hover { border-color: #2563eb; }
    .filtro-btn.activo {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }
    
    /* Grid de pedidos */
    .pedidos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    
    /* Card de pedido */
    .pedido-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
      border-left: 6px solid #e2e8f0;
      transition: transform 0.2s;
    }
    .pedido-card:hover { transform: translateY(-2px); }
    .pedido-card.preparacion { border-left-color: #f59e0b; }
    .pedido-card.listo { border-left-color: #10b981; }
    .pedido-card.retirado { border-left-color: #94a3b8; opacity: 0.7; }
    
    .pedido-numero {
      font-size: 2rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    .pedido-estado {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .estado-preparacion { background: #fef3c7; color: #92400e; }
    .estado-listo { background: #d1fae5; color: #065f46; }
    .estado-retirado { background: #f1f5f9; color: #475569; }
    
    .pedido-tiempo {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1rem;
    }
    .pedido-tiempo.urgente { color: #dc2626; font-weight: 600; }
    
    /* Botones de acción */
    .acciones { display: flex; gap: 0.5rem; }
    .btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-listo {
      background: #10b981;
      color: white;
    }
    .btn-listo:hover { background: #059669; }
    .btn-retirado {
      background: #64748b;
      color: white;
    }
    .btn-retirado:hover { background: #475569; }
    .btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
    
    /* Mensaje sin pedidos */
    .sin-pedidos {
      text-align: center;
      padding: 4rem 2rem;
      color: #94a3b8;
    }
    .sin-pedidos h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    
    /* Loading */
    .loading {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }
    
    /* Última actualización */
    .ultima-actualizacion {
      text-align: right;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 1rem;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .header { flex-direction: column; gap: 1rem; text-align: center; }
      .stats { justify-content: center; }
      .pedidos-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🍳 Panel de Cocina</h1>
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Totales</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-preparacion">0</div>
        <div class="stat-label">En Prep.</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-listo">0</div>
        <div class="stat-label">Listos</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-retirado">0</div>
        <div class="stat-label">Retirados</div>
      </div>
    </div>
  </div>
  
  <div class="filtros">
    <button class="filtro-btn activo" data-filtro="todos">Todos</button>
    <button class="filtro-btn" data-filtro="preparacion">⏳ En Preparación</button>
    <button class="filtro-btn" data-filtro="listo">✅ Listos</button>
    <button class="filtro-btn" data-filtro="retirado">📦 Retirados</button>
  </div>
  
  <div id="pedidos-grid" class="pedidos-grid">
    <div class="loading">Cargando pedidos...</div>
  </div>
  
  <div class="ultima-actualizacion">
    Última actualización: <span id="ultima-act">--:--:--</span>
    <button id="btn-refresh" style="margin-left: 0.5rem; cursor: pointer;">🔄</button>
  </div>

  <script>
    let filtroActual = 'todos';
    let pedidosCache = [];

    // Cargar pedidos
    const cargarPedidos = async () => {
  try {
    console.log('🔍 Cargando pedidos con filtro:', filtroActual);
    
    const res = await fetch(`/api/pedidos?filtro=${filtroActual}`);
    const data = await res.json();
    
    console.log('📦 Datos recibidos:', data);
    console.log('📋 Cantidad de pedidos:', data.pedidos?.length || 0);
    
    if (!data.pedidos) {
      console.error('❌ ERROR: data.pedidos es undefined');
      return;
    }
    
    if (!Array.isArray(data.pedidos)) {
      console.error('❌ ERROR: data.pedidos no es un array:', typeof data.pedidos);
      return;
    }
    
    pedidosCache = data.pedidos;
    renderizarPedidos(data.pedidos);
    actualizarStats();
    actualizarHora();
    
  } catch (err) {
    console.error('❌ Error cargando pedidos:', err);
    document.getElementById('pedidos-grid').innerHTML = 
      `<div class="sin-pedidos">
        <h2>⚠️ Error de conexión</h2>
        <p>${err.message}</p>
        <pre style="background: #fee; padding: 1rem; margin-top: 1rem; border-radius: 4px;">${err.stack}</pre>
      </div>`;
  }
};

    // Renderizar pedidos
    const renderizarPedidos = (pedidos) => {
  console.log('🎨 Renderizando pedidos:', pedidos);
  
  const grid = document.getElementById('pedidos-grid');
  
  if (!grid) {
    console.error('❌ ERROR: No se encontró el elemento #pedidos-grid');
    return;
  }
  
  if (!pedidos || pedidos.length === 0) {
    console.log('⚠️ No hay pedidos para renderizar');
    grid.innerHTML = `
      <div class="sin-pedidos">
        <h2>📋 Sin pedidos</h2>
        <p>No hay pedidos ${filtroActual !== 'todos' ? `con estado "${filtroActual}"` : ''} en este momento</p>
      </div>
    `;
    return;
  }
  
  try {
    const html = pedidos.map(pedido => {
      console.log('🔄 Renderizando pedido:', pedido);
      
      if (!pedido.token || !pedido.numero) {
        console.warn('⚠️ Pedido incompleto:', pedido);
        return '';
      }
      
      const tiempoClass = pedido.creadoHace >= 10 ? 'urgente' : '';
      const tiempoTexto = pedido.creadoHace < 1 ? '< 1 min' : `${pedido.creadoHace} min`;
      
      let botones = '';
      if (pedido.estado === 'preparacion') {
        botones = `
          <button class="btn btn-listo" onclick="marcarListo('${pedido.token}')">
            ✅ Marcar como Listo
          </button>
        `;
      } else if (pedido.estado === 'listo') {
        botones = `
          <button class="btn btn-retirado" onclick="marcarRetirado('${pedido.token}')">
            📦 Marcar como Retirado
          </button>
        `;
      } else {
        botones = `
          <button class="btn" disabled>✓ Completado</button>
        `;
      }
      
      return `
        <div class="pedido-card ${pedido.estado}">
          <div class="pedido-numero">#${pedido.numero}</div>
          <span class="pedido-estado estado-${pedido.estado}">
            ${pedido.estado === 'preparacion' ? '⏳ En Preparación' : 
              pedido.estado === 'listo' ? '✅ LISTO' : '📦 Retirado'}
          </span>
          <div class="pedido-tiempo ${tiempoClass}">
            ⏱️ Hace ${tiempoTexto}
          </div>
          <div class="acciones">
            ${botones}
          </div>
        </div>
      `;
    }).join('');
    
    console.log('✅ HTML generado:', html.substring(0, 100) + '...');
    grid.innerHTML = html;
    
  } catch (err) {
    console.error('❌ Error renderizando pedidos:', err);
    grid.innerHTML = `<div class="sin-pedidos"><h2>Error al renderizar</h2><p>${err.message}</p></div>`;
  }
};

    // Actualizar estadísticas
    const actualizarStats = (pedidos) => {
      // Necesitamos todos los pedidos para las stats, no solo los filtrados
      fetch('/api/pedidos?filtro=todos')
        .then(res => res.json())
        .then(data => {
          const total = data.pedidos.length;
          const preparacion = data.pedidos.filter(p => p.estado === 'preparacion').length;
          const listo = data.pedidos.filter(p => p.estado === 'listo').length;
          const retirado = data.pedidos.filter(p => p.estado === 'retirado').length;
          
          document.getElementById('stat-total').textContent = total;
          document.getElementById('stat-preparacion').textContent = preparacion;
          document.getElementById('stat-listo').textContent = listo;
          document.getElementById('stat-retirado').textContent = retirado;
        });
    };

    // Actualizar hora
    const actualizarHora = () => {
      const ahora = new Date();
      document.getElementById('ultima-act').textContent = 
        ahora.toLocaleTimeString('es-AR');
    };

    // Marcar como LISTO
    window.marcarListo = async (token) => {
      if (!confirm('¿Confirmar que este pedido está LISTO para retirar?')) return;
      
      try {
        const res = await fetch(`/api/pedido/${token}/listo`, { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
          await cargarPedidos(); // Recargar para ver cambios
          
          // Notificación visual
          const card = document.querySelector(`[onclick*="${token}"]`)?.closest('.pedido-card');
          if (card) {
            card.style.transform = 'scale(1.05)';
            setTimeout(() => card.style.transform = '', 300);
          }
        }
      } catch (err) {
        alert('Error al marcar como listo: ' + err.message);
      }
    };

    // Marcar como RETIRADO
    window.marcarRetirado = async (token) => {
      if (!confirm('¿El cliente YA RETIRÓ este pedido?')) return;
      
      try {
        const res = await fetch(`/api/pedido/${token}/retirado`, { method: 'POST' });
        const data = await res.json();
        
        if (data.success) {
          await cargarPedidos();
        }
      } catch (err) {
        alert('Error al marcar como retirado: ' + err.message);
      }
    };

    // Filtros
    document.querySelectorAll('.filtro-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
        filtroActual = btn.dataset.filtro;
        cargarPedidos();
      });
    });

    // Refresh manual
    document.getElementById('btn-refresh').addEventListener('click', cargarPedidos);

    // Auto-refresh cada 10 segundos
    setInterval(cargarPedidos, 10000);

    // Carga inicial
    cargarPedidos();
  </script>
</body>
</html>
