<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍔 Nuevo Pedido</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      text-align: center;
    }
    h1 { color: #0f172a; margin-bottom: 1.5rem; font-size: 1.5rem; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .resultado {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .resultado.activo { display: block; }
    .qr-container {
      background: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      display: inline-block;
    }
    .qr-container img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .info { font-size: 0.875rem; color: #64748b; margin: 0.5rem 0; }
    .token { 
      font-family: monospace; 
      background: #f1f5f9; 
      padding: 0.25rem 0.5rem; 
      border-radius: 4px;
      font-size: 0.8rem;
      word-break: break-all;
    }
    .numero-pedido {
      font-size: 2rem;
      font-weight: bold;
      color: #0f172a;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🍔 Generar Nuevo Pedido</h1>
    
    <button id="btn-crear" class="btn">✨ Crear Pedido + QR</button>
    
    <div id="resultado" class="resultado">
      <p class="info">Pedido número:</p>
      <div class="numero-pedido" id="pedido-numero">#----</div>
      
      <p class="info">QR para el cliente:</p>
      <div class="qr-container">
        <img id="qr-imagen" alt="QR del pedido" />
      </div>
      
      <p class="info">Token interno:</p>
      <div class="token" id="token-display">----</div>
      
      <p class="info" style="margin-top: 1.5rem;">
        ✅ El cliente escanea este QR y será notificado cuando su pedido esté listo.
      </p>
      
      <button id="btn-nuevo" class="btn" style="background: #64748b; margin-top: 1rem;">
        🔄 Otro pedido
      </button>
    </div>
  </div>

  <script>
    const btnCrear = document.getElementById('btn-crear');
    const btnNuevo = document.getElementById('btn-nuevo');
    const resultado = document.getElementById('resultado');
    
    const crearPedido = async () => {
      btnCrear.disabled = true;
      btnCrear.textContent = 'Generando...';
      
      try {
        const res = await fetch('/api/pedido/crear');
        const data = await res.json();
        
        if (data.success) {
          // Mostrar resultado
          document.getElementById('pedido-numero').textContent = `#${data.pedidoNumero}`;
          document.getElementById('qr-imagen').src = data.qrImage;
          document.getElementById('token-display').textContent = data.token;
          
          resultado.classList.add('activo');
          btnCrear.style.display = 'none';
        } else {
          alert('Error: ' + (data.error || 'Desconocido'));
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Error de conexión. Verificá que el servidor esté corriendo.');
      } finally {
        btnCrear.disabled = false;
        btnCrear.textContent = '✨ Crear Pedido + QR';
      }
    };
    
    const resetear = () => {
      resultado.classList.remove('activo');
      btnCrear.style.display = 'block';
    };
    
    btnCrear.addEventListener('click', crearPedido);
    btnNuevo.addEventListener('click', resetear);
  </script>
</body>
</html>
