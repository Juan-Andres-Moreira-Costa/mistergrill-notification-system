<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/images/mistergrill-logo.jpg" type="image/png">
  <title>Login - Mister Grill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      color: #0f172a;
      font-size: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .logo p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #1e293b;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .error.visible { display: block; }
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>🍳 Mister Grill</h1>
      <p>Acceso para personal</p>
    </div>
    
    <div id="error-msg" class="error"></div>
    
    <form id="login-form">
      <div class="form-group">
        <label for="username">👤 Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          required
        />
      </div>
      
      <div class="form-group">
        <label for="password">🔒 Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        />
      </div>
      
      <button type="submit" class="btn" id="btn-login">
        🔐 Iniciar Sesión
      </button>
    </form>
    
    <div class="footer">
      <p>By <strong>Tech House Melo</strong></p>
      <p id="current-year"></p>
    </div>
  </div>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const btnLogin = document.getElementById('btn-login');
    
    form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  
  console.log('🔍 [FRONTEND] Intentando login con:', username);
  
  btnLogin.disabled = true;
  btnLogin.textContent = 'Verificando...';
  errorMsg.classList.remove('visible');
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',  // ← CRÍTICO
      body: JSON.stringify({ username, password })
    });
    
    console.log('🔍 [FRONTEND] Respuesta:', res.status);
    
    const data = await res.json();
    console.log('🔍 [FRONTEND] Data:', data);
    
    if (res.ok && data.success) {
      console.log('✅ [FRONTEND] Login exitoso, redirigiendo a:', data.redirect);
      btnLogin.textContent = '✅ ¡Éxito!';
      
      // Pequeño delay para asegurar que la cookie se guardó
      setTimeout(() => {
        window.location.href = data.redirect || '/cocina';
      }, 500);
    } else {
      errorMsg.textContent = data.error || 'Credenciales inválidas';
      errorMsg.classList.add('visible');
      btnLogin.disabled = false;
      btnLogin.textContent = '🔐 Iniciar Sesión';
    }
  } catch (err) {
    console.error('❌ [FRONTEND] Error:', err);
    errorMsg.textContent = 'Error de conexión. Verificá el servidor.';
    errorMsg.classList.add('visible');
    btnLogin.disabled = false;
    btnLogin.textContent = '🔐 Iniciar Sesión';
  }
});
  </script>
</body>
</html>
